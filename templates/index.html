<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailscale Camera Stream</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .video-container { border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; }
        img { display: block; max-width: 100%; height: auto; }
        .controls { margin-top: 15px; display: flex; gap: 15px; }
        button { background: #007acc; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #005999; }
    </style>
</head>
<body>
    <h2>Live Camera Feed</h2>
    <p>Click the video feed to lock mouse control (Press ESC to unlock)</p>
    <div class="video-container" id="video-container">
        <img id="camera-feed" src="" alt="Connecting to stream...">
    </div>
    
    <div class="controls">
        <button onclick="sendPan('left')">&#8592; Left</button>
        <button onclick="sendPan('right')">Right &#8594;</button>
    </div>

    <script>
        const socket = io();
        const imgElement = document.getElementById('camera-feed');
        const container = document.getElementById('video-container');

        socket.on('frame', (data) => {
            imgElement.src = 'data:image/jpeg;base64,' + data.data;
        });

        function sendPan(dir) {
            socket.emit('pan', { direction: dir });
        }

        // --- Pointer Lock & Controls Implementation --- //

        // 1. Request pointer lock on clicking the video container
        container.addEventListener('click', () => {
            container.requestPointerLock();
        });

        // 2. Handle state changes when locked or unlocked
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === container) {
                console.log('Pointer locked');
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('keydown', handleKeyDown);
            } else {
                console.log('Pointer unlocked');
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('keydown', handleKeyDown);
            }
        });

        // 3. Track relative mouse movement X and Y
        function handleMouseMove(e) {
            const movementX = e.movementX || 0;
            const movementY = e.movementY || 0;

            console.log(`Mouse Deltas -> X: ${movementX}, Y: ${movementY}`);

            // Emit mouse movements to backend if desired
            // socket.emit('motor_move', { x: movementX, y: movementY });
        }

        // 4. Track keyboard input while locked
        function handleKeyDown(e) {
            console.log(`Key Pressed: ${e.key} (Code: ${e.code})`);

            // Example: WASD or Arrow controls via keyboard
            if (['KeyW', 'ArrowUp'].includes(e.code)) {
                socket.emit('pan', { direction: 'up' });
            } else if (['KeyS', 'ArrowDown'].includes(e.code)) {
                socket.emit('pan', { direction: 'down' });
            } else if (['KeyA', 'ArrowLeft'].includes(e.code)) {
                socket.emit('pan', { direction: 'left' });
            } else if (['KeyD', 'ArrowRight'].includes(e.code)) {
                socket.emit('pan', { direction: 'right' });
            }
        }
    </script>
</body>
</html>
